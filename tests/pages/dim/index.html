<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #8a8a8a; margin: 0; padding: 2rem; }
  /* 1.16:1. It looked tasteful in the mock and is unreadable in daylight. */
  p { color: #949494; }
  h1, button { color: #000; }
</style>
<body>
  <main>
    <h1>Notes</h1>
    <p>Everything you wrote down last week, gathered in one quiet place.</p>
    <button id="b">Open</button>
  </main>
<script type="module">
  document.getElementById('b').addEventListener('click', e => { e.target.textContent = 'Opened'; });
</script>
